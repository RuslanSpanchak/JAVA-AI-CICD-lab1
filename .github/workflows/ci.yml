name: Java Maven CI

on:
  push:
    branches: [develop, main, master, "feature/**"]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The CI workflow delegates build, tests, and executable packaging to scripts.
      - name: Run CI script (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/ci.sh

      - name: Run CI script (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\ci.bat

      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: hello-${{ matrix.os }}
          path: build/hello.jar
          if-no-files-found: error
